name: E2E/Playwright Tests

on:
  push:
    branches:
      - 'main'
      - 'develop'
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      dist: ${{ steps.workflow.outputs.DIST }}
      package: ${{ steps.workflow.outputs.PACKAGE }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer, cs2pr

      - name: Setup workflow context
        id: workflow
        working-directory: ${{ runner.temp }}
        env:
          REPO: ${{ github.repository }}
        run: |
          mkdir dist
          echo "DIST=${PWD}/dist" >> "$GITHUB_OUTPUT"
          echo "PACKAGE=${REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24.15.0
          cache: 'npm'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer vendor directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Show versions
        run: |
          php --version
          composer --version
          node --version
          npm --version

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install PHP Dependencies
        run: composer install --no-progress --no-dev --optimize-autoloader --prefer-source

      - name: NPM Install
        run: npm install --legacy-peer-deps

      - name: Build JavaScript
        run: npm run build

      - name: Create Distribution Copy
        env:
          DIST: ${{ steps.workflow.outputs.DIST }}
          PACKAGE: ${{ steps.workflow.outputs.PACKAGE }}
        run: rsync -r --include-from=.distinclude --exclude-from=.distignore . "$DIST/$PACKAGE"

      - name: List Distribution Files
        env:
          DIST: ${{ steps.workflow.outputs.DIST }}
        run: |
          cd "$DIST"
          find .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: ${{ steps.workflow.outputs.DIST }}
          name: ${{ steps.workflow.outputs.PACKAGE }}
          retention-days: 7

  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer, cs2pr

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24.15.0
          cache: 'npm'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer vendor directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install PHP Dependencies
        run: composer install --no-progress --no-dev --optimize-autoloader --prefer-source

      - name: NPM Install
        run: npm install --legacy-peer-deps

      - name: Setup workflow context
        id: workflow
        working-directory: ${{ runner.temp }}
        env:
          REPO: ${{ github.repository }}
        run: |
          mkdir dist
          echo "DIST=${PWD}/dist" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: ${{ steps.workflow.outputs.DIST }}
          name: ${{ needs.build.outputs.package }}

      # Fetch latest stable from wordpress.org (zip), not GitHub tags — the mirror
      # can lag behind wordpress.org releases and break `wp-env start`.
      - name: Fetch latest WordPress release
        id: fetch_wp
        run: |
          set -euo pipefail
          OFFER=$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 \
            'https://api.wordpress.org/core/version-check/1.7/')
          WP_DOWNLOAD_URL=$(echo "$OFFER" | jq -r '.offers[0].download // empty')
          WP_VERSION=$(echo "$OFFER" | jq -r '.offers[0].version // empty')
          if [ -z "$WP_DOWNLOAD_URL" ]; then
            echo "::error::Could not resolve a WordPress download URL from the version-check API."
            echo "$OFFER" | head -c 500
            exit 1
          fi
          echo "download_url=$WP_DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "version=$WP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using WordPress $WP_VERSION from $WP_DOWNLOAD_URL"

      - name: Configure WordPress
        env:
          DIST: ${{ steps.workflow.outputs.DIST }}
          PACKAGE: ${{ needs.build.outputs.package }}
          WP_ZIP: ${{ steps.fetch_wp.outputs.download_url }}
        run: |
          jq -n \
            --arg core "$WP_ZIP" \
            --arg plugin "$DIST/$PACKAGE" \
            '{core: $core, plugins: [$plugin]}' > .wp-env.override.json

      - name: Install WordPress
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 4
          max_attempts: 3
          command: |
            pwd
            ls -la .wp-env*
            cat .wp-env.override.json
            npx wp-env start --debug
            npx wp-env run cli wp core version

      - name: Verify WordPress is ready
        run: |
          echo "Verifying WordPress is ready..."
          pwd
          ls -la .wp-env*
          npx wp-env run cli wp core version
          echo "WordPress is ready!"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test --reporter=line
        env:
          CI: true

      - name: Store Playwright test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: tests/playwright/test-results/
          retention-days: 10

      - name: Output debug.log file contents
        if: always()
        continue-on-error: true
        run: |
          npx wp-env run wordpress cat /var/www/html/wp-content/debug.log

      - name: Output wordpress docker logs
        if: always()
        continue-on-error: true
        run: |
          npx wp-env logs --watch=false --debug=true
